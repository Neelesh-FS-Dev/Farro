<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Farro, Koregaon Park, Pune. New Age cuisine inspired by culture, journeys and shared traditions." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f2e9" />
    <meta property="og:title" content="Farro · Every plate begins somewhere." />
    <meta property="og:description" content="New Age cuisine inspired by culture, journeys and shared traditions. Koregaon Park, Pune." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" type="image/webp" href="/media/dish-sphere-1024.webp" imagesrcset="/media/dish-sphere-640.webp 640w, /media/dish-sphere-1024.webp 1024w" imagesizes="(min-width: 1080px) 46vw, 92vw" fetchpriority="high" />
    <title>Farro · Every plate begins somewhere.</title>
  </head>
  <body>
    <div id="root">
      <!-- Static first paint of the hero, replaced by the app on mount. Keeps LCP off the JS critical path. -->
      <main id="main" class="shell">
        <section class="chapter hero" aria-labelledby="hero-title">
          <div class="wrap grid-12 hero__grid">
            <div class="hero__copy">
              <p class="hero__meta">Koregaon Park · Pune</p>
              <h1 id="hero-title"><span class="line">Every plate</span> <span class="line">begins somewhere.</span></h1>
              <p class="lede">New Age cuisine inspired by culture, journeys &amp; shared traditions.</p>
              <div class="hero__actions">
                <a class="btn btn--primary" href="https://www.district.in/dining/pune/farro-koregaon-park" rel="noopener noreferrer">Reserve a Table</a>
                <a class="btn" href="/menu">Explore the Menu</a>
              </div>
            </div>
            <div class="hero__media">
              <figure class="frame frame--main" style="margin:0">
                <picture>
                  <source type="image/webp" srcset="/media/dish-sphere-640.webp 640w, /media/dish-sphere-1024.webp 1024w" sizes="(min-width: 1080px) 46vw, 92vw" />
                  <img src="/media/dish-sphere-1024.jpg" srcset="/media/dish-sphere-640.jpg 640w, /media/dish-sphere-1024.jpg 1024w" sizes="(min-width: 1080px) 46vw, 92vw" width="1024" height="1280" alt="A plate of spheres in a warm orange sauce, garnished with herbs" fetchpriority="high" style="aspect-ratio:4/5" />
                </picture>
              </figure>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
